name = "moinmoin-mcp"
main = "src/index.js"
compatibility_date = "2025-11-01"

# Only the custom domain (moinmoin-mcp.shaneqi.com) serves the Worker. Every
# deploy keeps the workers.dev URL and preview URLs off. No routes are listed
# here, so the custom domain set up in the dashboard is left as it is.
workers_dev = false
preview_urls = false

# Bindings are managed in the Cloudflare dashboard, not here: the variables
# (MOIN_URL, ALLOW_WRITES, CF_ACCESS_TEAM_DOMAIN, CF_ACCESS_AUD) and the
# secrets (MOIN_USER, MOIN_PASSWORD). keep_bindings tells the upload API to
# keep the existing bindings of these types, so a deploy only replaces the code.
[unsafe.metadata]
keep_bindings = ["plain_text", "json", "secret_text", "secret_key"]

# Chunked attachment uploads are staged in a Durable Object (src/uploads.js),
# one object per upload, so chunks never reach the wiki. Durable Object
# bindings aren't covered by keep_bindings, so this one lives here.
[[durable_objects.bindings]]
name = "UPLOADS"
class_name = "UploadStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UploadStore"]
